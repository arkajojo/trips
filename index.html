<style>
:root{--paper:#f5f8f3;--ink:#1b2a23;--muted:#5a6b62;--line:#d6ded8;--jade:#0f7b6c;--jade-soft:#dff0ec;--hibiscus:#c8395f;--mustard:#d99a12;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#131d18;--ink:#e8efe9;--muted:#9fb0a6;--line:#2c3a33;--jade:#4fc3ad;--jade-soft:#17322c;--hibiscus:#f07a98;--mustard:#f2bc3d;--card:#1a2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Karla,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:0 18px 80px}
.tiles{height:14px;margin:0 -18px 30px;background:repeating-linear-gradient(90deg,var(--jade) 0 24px,var(--hibiscus) 24px 48px,var(--mustard) 48px 72px,var(--jade-soft) 72px 96px)}
h1{font-family:Fraunces,Georgia,serif;font-size:2.3rem;line-height:1.1;margin:0 0 10px}
p.lead{color:var(--muted);font-size:1.1rem;margin:0 0 34px;max-width:32em}
.trip{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.trip:hover{border-color:var(--jade)}
.trip b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.35rem;margin-bottom:4px}
.trip span{color:var(--muted);font-size:.95rem}
.trip .links{margin-top:10px;font-size:.9rem}
.trip .links em{font-style:normal;color:var(--jade);font-weight:700;margin-right:14px}
footer{margin-top:50px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
