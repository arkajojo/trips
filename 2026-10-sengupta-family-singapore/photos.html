<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos — Treena, Swapnadeep & Ayanshi in Singapore, Oct 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f8f3;--ink:#1b2a23;--muted:#5a6b62;--line:#d6ded8;--jade:#0f7b6c;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#131d18;--ink:#e8efe9;--muted:#9fb0a6;--line:#2c3a33;--jade:#4fc3ad;--card:#1a2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Karla,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:24px 18px 80px}
h1{font-family:Fraunces,Georgia,serif;font-size:2rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px}
a{color:var(--jade)}
h2{font-family:Fraunces,Georgia,serif;font-size:1.2rem;margin:28px 0 10px;border-top:2px solid var(--jade);padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--card);display:block}
.empty{padding:40px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
dialog{border:none;background:rgba(0,0,0,.92);padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh}
dialog img{max-width:100vw;max-height:88vh;display:block;margin:2vh auto 0;object-fit:contain}
dialog figcaption{color:#ddd;text-align:center;font-size:.9rem;padding:8px}
dialog::backdrop{background:rgba(0,0,0,.9)}
</style>
</head>
<body>
<main>
<h1>Photos</h1>
<p><a href="./">← Back to the itinerary</a> · Treena, Swapnadeep &amp; Ayanshi in Singapore, 18–31 October 2026</p>
<div id="gallery"><div class="empty">No photos yet — drop images into <code>photos/</code>, run <code>tools/make-gallery.py</code>, push.</div></div>
<dialog id="lb"><figure style="margin:0"><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></dialog>
</main>
<script>
(async()=>{
  const g=document.getElementById('gallery');
  let items=[];
  try{ const r=await fetch('photos/photos.json',{cache:'no-store'}); items=await r.json(); }catch(e){ return; }
  if(!Array.isArray(items)||!items.length) return;
  items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const byDay={};
  for(const it of items){ const d=(it.date||'undated').slice(0,10); (byDay[d]=byDay[d]||[]).push(it); }
  g.innerHTML='';
  const fmt=d=>d==='undated'?'Undated':new Date(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  for(const d of Object.keys(byDay)){
    const h=document.createElement('h2'); h.textContent=fmt(d); g.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    for(const it of byDay[d]){
      const img=document.createElement('img'); img.loading='lazy'; img.src='photos/'+it.file; img.alt=it.caption||it.file;
      img.onclick=()=>{ document.getElementById('lbimg').src='photos/'+it.file; document.getElementById('lbcap').textContent=it.caption||''; document.getElementById('lb').showModal(); };
      grid.appendChild(img);
    }
    g.appendChild(grid);
  }
  document.getElementById('lb').onclick=e=>e.currentTarget.close();
})();
</script>
</body>
</html>
